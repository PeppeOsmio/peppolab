x-logging: &logging
  logging:
    driver: "json-file"
    options:
      max-size: "10MB"
      max-file: "10"

services:
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: prometheus
    volumes:
      - ./prometheus:/etc/prometheus
      # sudo chown -R 65534:65534 /docker_data/tig_stack/volumes/prometheus
      - /docker_data/tig_stack/volumes/prometheus:/prometheus
    networks:
      - internal
      - traefik_global
    restart: unless-stopped
    <<: *logging

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    command:
      - '--web.listen-address=172.17.0.1:9100'
    volumes:
      - /:/host:ro,rslave
    network_mode: host
    restart: unless-stopped
    pid: host
    <<: *logging

  # alertmanager:
  #   image: prom/alertmanager
  #   volumes:
  #     - /docker_data/tig_stack/configs/alertmanager:/etc/alertmanager
  #   networks:
  #     - internal
  #   restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    restart: unless-stopped
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:rw
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
    - /dev:/dev:ro
    networks:
      - internal
    <<: *logging

  grafana:
    container_name: grafana
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    volumes:
      - /docker_data/tig_stack/volumes/grafana_data:/var/lib/grafana
      - /docker_data/tig_stack/volumes/grafana_logs:/var/log/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: "${GF_SECURITY_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD}"
    networks:
      - internal
      - traefik_global
    user: root
    <<: *logging

networks:
  internal:
  traefik_global:
    external: true
