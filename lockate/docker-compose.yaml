x-logging: &logging
  logging:
    driver: "json-file"
    options:
      max-size: "10MB"
      max-file: "10"

services:
  postgres:
    image: postgres:16-bullseye
    restart: unless-stopped
    volumes:
      - /docker_data/lockate/volumes/postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: "lockate"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    networks:
      internal:
    <<: *logging

  valkey:
    image: valkey/valkey:8.1.3-alpine
    command: ["valkey-server", "--requirepass", "${REDIS_PASSWORD}"]
    restart: unless-stopped
    networks:
      internal:

  lockate-api:
    build:
      context: lockate/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: "postgresql://postgres:5432/lockate"
      DB_USERNAME: "${POSTGRES_USER}"
      DB_PASSWORD: "${POSTGRES_PASSWORD}"
      REDIS_HOST: "valkey"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REQUIRE_API_KEY: "${REQUIRE_API_KEY}"
      ADMIN_API_KEY: "${ADMIN_API_KEY}"
      ADMIN_UI_ORIGIN: "${ADMIN_UI_ORIGIN}"
    ports:
      - 3118:3118
    networks:
      internal:
      traefik_global:
    <<: *logging

  lockate-admin-ui:
    build:
      context: lockate/admin_ui
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: "${VITE_API_BASE_URL}"
      NGINX_ENVSUBST_OUTPUT_DIR: "/usr/share/nginx/html"
    ports:
      - 3119:80
    depends_on:
      - lockate-api
    <<: *logging

networks:
  internal:
  traefik_global:
    external: true